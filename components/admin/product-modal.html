<!-- Product Edit / Add Modal -->
<div id="product-modal" class="modal-backdrop fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
  <div class="glass-card max-w-xl w-full p-6 md:p-8 rounded-2xl border border-white/10 shadow-2xl relative overflow-hidden max-h-[90vh] overflow-y-auto">
    <button onclick="closeProductModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl z-10">&times;</button>
    
    <h3 id="product-modal-title" class="font-title text-xl font-bold text-gold mb-6"><i class="fa-solid fa-plus-circle mr-2"></i>Add New Product</h3>
    
    <form id="product-form" onsubmit="handleSaveProduct(event)" class="space-y-4">
      <input type="hidden" id="prod-modal-id" />
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Product SKU / ID *</label>
          <input type="text" id="prod-sku" required placeholder="men-ves-sir" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors" />
        </div>
        <div>
          <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Product Name *</label>
          <input type="text" id="prod-name" required placeholder="DOCI YES SIR" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors" />
        </div>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Gender *</label>
          <select id="prod-gender" class="w-full bg-[#111111] border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors">
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="unisex">Unisex</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Category *</label>
          <input type="text" id="prod-category" required placeholder="Fresh & Crisp" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors" />
        </div>
        <div>
          <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Inspired By *</label>
          <input type="text" id="prod-inspired" required placeholder="YSL Y EDP" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors" />
        </div>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Sale Price (VND) *</label>
          <input type="number" id="prod-price" required min="0" step="1000" placeholder="319000" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors" />
        </div>
        <div>
          <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Original Price (VND)</label>
          <input type="number" id="prod-original-price" min="0" step="1000" placeholder="450000" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors" />
        </div>
        <div>
          <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Inventory Stock *</label>
          <input type="number" id="prod-stock" required min="0" step="1" placeholder="50" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Longevity</label>
          <input type="text" id="prod-longevity" placeholder="6 - 8 Hours" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors" />
        </div>
        <div>
          <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Projection</label>
          <input type="text" id="prod-projection" placeholder="1 - 2 Meters" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors" />
        </div>
      </div>
      
      <div>
        <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Product Image Path / URL *</label>
        <input type="text" id="prod-image" required placeholder="assets/images/..." class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-gold/55 focus:outline-none transition-colors" />
      </div>
      
      <div>
        <label class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1 block">Description</label>
        <textarea id="prod-description" rows="3" placeholder="Enter perfume description..." class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs text-white resize-none focus:border-gold/55 focus:outline-none transition-colors"></textarea>
      </div>
      
      <div class="pt-4 flex gap-3">
        <button type="button" onclick="closeProductModal()" class="flex-1 py-2.5 border border-white/10 hover:bg-white/5 text-gray-400 hover:text-white font-bold text-xs rounded transition-all">CANCEL</button>
        <button type="submit" class="flex-1 py-2.5 bg-gold hover:bg-gold/85 text-black font-bold text-xs rounded tracking-widest transition-all">SAVE PRODUCT</button>
      </div>
    </form>
  </div>
</div>
