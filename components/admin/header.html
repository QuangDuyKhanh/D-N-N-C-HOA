<!-- Header Quản Trị -->
<header class="border-b border-white/10 py-5 bg-black/60 sticky top-0 z-40 backdrop-blur-md">
  <div class="container mx-auto px-4 md:px-8 flex justify-between items-center">
    <a href="#" class="flex flex-col items-start">
      <span class="font-title text-xl font-bold tracking-[4px] text-white">DOCI</span>
      <span class="text-[7px] uppercase tracking-[3px] text-gold font-semibold -mt-1">ADMIN PORTAL</span>
    </a>
    <div class="flex items-center gap-4">
      <button id="sound-toggle-btn" onclick="toggleSound()" class="w-10 h-10 rounded-full border border-white/10 hover:border-gold/50 flex items-center justify-center text-gray-400 hover:text-gold transition-colors" title="Toggle new order notification sound">
        <i id="sound-icon" class="fa-solid fa-volume-high text-sm"></i>
      </button>
      <button onclick="refreshOrders(true)" class="bg-gold/10 hover:bg-gold/20 border border-gold/30 hover:border-gold/60 text-gold text-xs font-semibold px-4 py-2 rounded-md flex items-center gap-2 transition-all">
        <i class="fa-solid fa-arrows-rotate"></i> Refresh
      </button>
      <button onclick="handleLogout()" class="border border-red-500/20 hover:border-red-500/50 bg-red-950/20 hover:bg-red-950/40 text-red-400 text-xs font-semibold px-4 py-2 rounded-md flex items-center gap-1.5 transition-all" title="Sign Out">
        <i class="fa-solid fa-right-from-bracket"></i> Sign Out
      </button>
    </div>
  </div>
</header>
