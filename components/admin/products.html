<!-- Section: Products & Inventory -->
<div id="section-products" class="hidden">
  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <div class="glass-card p-6 rounded-xl relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl"><i class="fa-solid fa-boxes-stacked"></i></div>
      <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider block mb-1">Total Products</span>
      <h3 id="stat-total-products" class="text-2xl font-bold text-white">0</h3>
      <p class="text-[9px] text-gray-500 mt-1">Active items in catalog</p>
    </div>
    <div class="glass-card p-6 rounded-xl relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl"><i class="fa-solid fa-warehouse"></i></div>
      <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider block mb-1">Total Stock Units</span>
      <h3 id="stat-total-stock" class="text-2xl font-bold text-gold">0</h3>
      <p class="text-[9px] text-gray-500 mt-1">Available bottles in store</p>
    </div>
    <div class="glass-card p-6 rounded-xl relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider block mb-1">Low Stock Items</span>
      <h3 id="stat-low-stock" class="text-2xl font-bold text-amber-500">0</h3>
      <p class="text-[9px] text-gray-500 mt-1">&le; 10 units remaining</p>
    </div>
    <div class="glass-card p-6 rounded-xl relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl"><i class="fa-solid fa-ban"></i></div>
      <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider block mb-1">Out of Stock</span>
      <h3 id="stat-out-stock" class="text-2xl font-bold text-red-500">0</h3>
      <p class="text-[9px] text-gray-500 mt-1">0 units remaining</p>
    </div>
  </div>

  <!-- Controls -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div class="flex items-center gap-2 overflow-x-auto pb-2 md:pb-0">
      <button id="tab-p-all" onclick="setProductFilter('all')" class="px-4 py-2 rounded-md text-xs font-semibold tracking-wider transition-all bg-gold text-black">
        All Products (<span id="count-p-all">0</span>)
      </button>
      <button id="tab-p-men" onclick="setProductFilter('men')" class="px-4 py-2 rounded-md text-xs font-semibold tracking-wider transition-all bg-white/5 text-gray-400 hover:text-white">
        Men (<span id="count-p-men">0</span>)
      </button>
      <button id="tab-p-women" onclick="setProductFilter('women')" class="px-4 py-2 rounded-md text-xs font-semibold tracking-wider transition-all bg-white/5 text-gray-400 hover:text-white">
        Women (<span id="count-p-women">0</span>)
      </button>
    </div>

    <div class="flex items-center gap-3 w-full md:w-auto">
      <div class="relative flex-grow md:flex-grow-0 md:w-64">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
        <input type="text" id="product-search-input" onkeyup="handleProductSearch()" placeholder="Search perfume..." class="w-full bg-white/5 border border-white/10 rounded-lg pl-9 pr-3 py-2 text-xs text-white placeholder-gray-500 focus:border-gold/55 focus:outline-none transition-colors" />
      </div>
      <button onclick="openProductModal()" class="bg-gold hover:bg-gold/85 text-black font-bold text-xs px-4 py-2 rounded-lg flex items-center gap-2 transition-all whitespace-nowrap">
        <i class="fa-solid fa-plus-circle"></i> Add Product
      </button>
    </div>
  </div>

  <!-- Product Catalog List -->
  <div id="products-list-container" class="space-y-4"></div>

  <!-- No Products -->
  <div id="no-products-msg" class="hidden glass-card p-12 text-center rounded-xl border border-white/5">
    <i class="fa-solid fa-box-open text-4xl text-gray-600 mb-3"></i>
    <p class="text-sm font-semibold text-gray-400">No products found</p>
    <p class="text-xs text-gray-600 mt-1">Try resetting search or add a new perfume item.</p>
  </div>
</div>
