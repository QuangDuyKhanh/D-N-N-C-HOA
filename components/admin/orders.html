<!-- Section 1: Order Management -->
<div id="section-orders">
  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <div class="glass-card p-6 rounded-xl relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl"><i class="fa-solid fa-wallet"></i></div>
      <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider block mb-1">Expected Revenue</span>
      <h3 id="stat-revenue" class="text-2xl font-bold text-gold">0 VND</h3>
      <p class="text-[9px] text-gray-500 mt-1">* Calculated from Pending & Confirmed orders</p>
    </div>
    <div class="glass-card p-6 rounded-xl relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl"><i class="fa-solid fa-cart-shopping"></i></div>
      <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider block mb-1">Total Orders</span>
      <h3 id="stat-total-orders" class="text-2xl font-bold text-white">0</h3>
      <p class="text-[9px] text-gray-500 mt-1">Includes cancelled orders</p>
    </div>
    <div class="glass-card p-6 rounded-xl border-l-4 border-yellow-500 relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl"><i class="fa-solid fa-clock"></i></div>
      <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider block mb-1">Pending Orders</span>
      <h3 id="stat-pending" class="text-2xl font-bold text-yellow-500">0</h3>
      <p class="text-[9px] text-gray-500 mt-1">Confirmation required</p>
    </div>
    <div class="glass-card p-6 rounded-xl border-l-4 border-green-500 relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-white/5 text-7xl"><i class="fa-solid fa-check"></i></div>
      <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider block mb-1">Confirmed Orders</span>
      <h3 id="stat-confirmed" class="text-2xl font-bold text-green-500">0</h3>
      <p class="text-[9px] text-gray-500 mt-1">Ready for packing & shipping</p>
    </div>
  </div>

  <!-- Control Bar -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <!-- Filter Tabs -->
    <div class="flex flex-wrap gap-2">
      <button id="tab-all" onclick="setFilter('all')" class="px-4 py-2 rounded-md text-xs font-semibold tracking-wider transition-all bg-gold text-black">All (<span id="count-all">0</span>)</button>
      <button id="tab-pending" onclick="setFilter('pending')" class="px-4 py-2 rounded-md text-xs font-semibold tracking-wider transition-all bg-white/5 text-gray-400 hover:text-white">Pending (<span id="count-pending">0</span>)</button>
      <button id="tab-confirmed" onclick="setFilter('confirmed')" class="px-4 py-2 rounded-md text-xs font-semibold tracking-wider transition-all bg-white/5 text-gray-400 hover:text-white">Confirmed (<span id="count-confirmed">0</span>)</button>
      <button id="tab-cancelled" onclick="setFilter('cancelled')" class="px-4 py-2 rounded-md text-xs font-semibold tracking-wider transition-all bg-white/5 text-gray-400 hover:text-white">Cancelled (<span id="count-cancelled">0</span>)</button>
    </div>

    <!-- Search & Actions -->
    <div class="flex items-center gap-3 w-full md:w-auto self-end md:self-auto">
      <div class="relative flex-grow md:flex-grow-0">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
        <input type="text" id="order-search-input" oninput="handleOrderSearch()" placeholder="Search order code, item, phone..." class="w-full md:w-64 bg-white/5 border border-white/10 rounded-lg pl-9 pr-4 py-2 text-xs text-white placeholder-gray-600 focus:border-gold/55 focus:outline-none transition-colors" />
      </div>
      <button onclick="clearAllOrders()" class="bg-red-950/40 hover:bg-red-900/50 border border-red-500/20 hover:border-red-500/50 text-red-400 text-xs font-semibold px-4 py-2 rounded-md transition-all flex items-center gap-2 whitespace-nowrap">
        <i class="fa-solid fa-trash-can"></i> Clear Order History
      </button>
    </div>
  </div>

  <!-- Orders List Container -->
  <div id="orders-list-container" class="space-y-4">
    <div id="no-orders-msg" class="glass-card rounded-xl p-12 text-center flex flex-col items-center justify-center gap-4">
      <i class="fa-solid fa-receipt text-gray-600 text-5xl"></i>
      <h4 class="text-sm font-bold text-gray-300">No orders recorded yet</h4>
      <p class="text-xs text-gray-500">New customer orders will appear directly here.</p>
    </div>
  </div>
</div>
